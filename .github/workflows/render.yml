name: Render Poke Motion
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright
          python -m pip install edge-tts
          npx playwright install --with-deps chromium
          npx remotion browser ensure
      - name: Capture authentic Liga Pokemon pages
        run: node scripts/capture.mjs
      - name: Upload capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-liga-pokemon
          path: public/captures/
          if-no-files-found: warn
          retention-days: 7
      - name: Validate captures
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          names=['intro','site','search','prices','shop','checkout','end']
          folder=Path('public/captures')
          missing=[n for n in names if not (folder/(n+'.png')).is_file()]
          assert not missing, 'Missing authentic screenshots: '+', '.join(missing)
          data=json.loads((folder/'manifest.json').read_text())
          assert len(data['captures'])==7, 'Expected 7 recorded captures'
          assert all(c['url'].startswith('https://www.ligapokemon.com.br/') for c in data['captures'])
          PY
      - name: Generate narration and word timing
        run: python scripts/voice.py
      - name: Render vertical MP4
        run: npm run render
      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: poke-achadinhos-mp4
          path: out/poke-achadinhos.mp4
          if-no-files-found: error
          retention-days: 7
